<!DOCTYPE html>
<html>
<head>
    <title>Calendar Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <script src="lib/chart.umd.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
    <div class="container">
        <h1>Calendar Analysis</h1>
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Loading calendar data...</p>
        </div>
        <div class="controls">
            <div class="date-controls">
                <button id="prevWeek" class="nav-button" title="Previous 7 Days">&larr; Prev 7 Days</button>
                <div class="date-input">
                    <label for="startDate">Start Date:</label>
                    <input type="date" id="startDate">
                </div>
                <div class="date-input">
                    <label for="endDate">End Date:</label>
                    <input type="date" id="endDate">
                </div>
                <button id="nextWeek" class="nav-button" title="Next 7 Days">Next 7 Days &rarr;</button>
            </div>
            <div class="preset-controls">
                <select id="timeRange">
                    <option value="custom">Custom Range</option>
                    <option value="day">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
                <button id="refresh">Refresh</button>
            </div>
        </div>
        <div id="combineSection" class="combine-section" style="display: none;">
            <h3>Combine Categories</h3>
            <div id="categoryCheckboxes" class="category-checkboxes"></div>
            <div class="combine-controls">
                <input type="text" id="combinedCategoryName" placeholder="Enter combined category name">
                <button id="applyCombine">Apply Combination</button>
                <button id="clearCombine">Clear</button>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="histogramChart"></canvas>
        </div>
        <div id="eventTable" class="event-table-container" style="display: none;">
            <h2 id="tableTitle"></h2>
            <table class="event-table">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="eventTableBody">
                </tbody>
            </table>
        </div>
    </div>
        </div>
        <div class="sidebar">
            <h2>Category Averages</h2>
            <div class="sidebar-controls">
                <label for="weeksBack">Past weeks:</label>
                <input type="number" id="weeksBack" min="1" max="52" value="4">
                <button id="calculateAverages">Calculate</button>
            </div>
            <div id="averagesContainer" class="averages-container">
                <p class="empty-message">Click Calculate to view category averages</p>
            </div>
        </div>
    </div>
    <script src="calendar-data.js"></script>
    <script src="histogram.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
